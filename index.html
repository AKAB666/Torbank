<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <title>TOR Bank</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="top">
      <div>
        <div class="muted">Добрый день</div>
        <h1>TOR Bank</h1>
      </div>
      <button class="icon-btn" id="profileBtn">👤</button>
    </header>

    <main>
      <section class="balance-card">
        <div class="muted light">Основной счёт</div>
        <div class="balance" id="balance">125 430,50 ₽</div>
        <div class="card-mini">
          <span>TOR</span>
          <span>•••• 4821</span>
        </div>
      </section>

      <section class="actions">
        <button data-action="transfer"><b>↗</b><span>Перевести</span></button>
        <button data-action="topup"><b>＋</b><span>Пополнить</span></button>
        <button data-action="pay"><b>⌁</b><span>Оплатить</span></button>
        <button data-action="details"><b>▣</b><span>Реквизиты</span></button>
      </section>

      <section class="section-head">
        <h2>Мои карты</h2><button class="text-btn" data-action="cards">Все</button>
      </section>
      <section class="bank-card">
        <div class="card-row"><strong>TOR CARD</strong><span>VIRTUAL</span></div>
        <div class="card-number">••••  ••••  ••••  4821</div>
        <div class="card-row bottom"><span>MATVEY B.</span><span>VISA</span></div>
      </section>

      <section class="section-head">
        <h2>Последние операции</h2><button class="text-btn" data-action="history">Все</button>
      </section>
      <section class="transactions" id="transactions"></section>

      <section class="promo">
        <div>
          <strong>Контроль расходов</strong>
          <p>Следи за категориями и лимитами в одном месте.</p>
        </div>
        <span>📊</span>
      </section>
    </main>

    <nav class="bottom-nav">
      <button class="active" data-nav="home">⌂<small>Главная</small></button>
      <button data-nav="cards">▣<small>Карты</small></button>
      <button data-nav="payments">↗<small>Платежи</small></button>
      <button data-nav="profile">●<small>Профиль</small></button>
    </nav>
  </div>

  <div class="modal hidden" id="modal">
    <div class="sheet">
      <button class="close" id="closeModal">×</button>
      <h2 id="modalTitle">Операция</h2>
      <div id="modalBody"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
